name: Multi-platform Build of cppfront
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compiler name & version
        run: cl.exe
      - name: Build
        run: cl.exe source/cppfront.cpp -std:c++latest -MD -EHsc -experimental:module -W4 -WX
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cppfront
          path: cppfront-windows.exe
          overwrite: true

  build-unix-like:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04]
        compiler: [g++-10, g++-11, g++-12, clang++-12, clang++-14]
        cxx-std: ['c++20', 'c++2b']
        exclude:
          # GCC 10 doesn't have support for c++23
          - compiler: g++-10
            cxx-std: 'c++2b'
          # Clang 12 and 14 do not compile on 'c++2b' due to llvm/llvm-project#58206
          - compiler: clang++-12
            cxx-std: 'c++2b'
          - compiler: clang++-14
            cxx-std: 'c++2b'
        include:
          - runs-on: macos-latest
            compiler: clang++
            cxx-std: 'c++20'
          - runs-on: ubuntu-22.04
            compiler: clang++-15
            cxx-std: 'c++20'
          - runs-on: ubuntu-24.04
            compiler: clang++-16
            cxx-std: 'c++20'
          - runs-on: ubuntu-24.04
            compiler: clang++-17
            cxx-std: 'c++20'
          - runs-on: ubuntu-24.04
            compiler: clang++-18
            cxx-std: 'c++20'
          - runs-on: ubuntu-24.04
            compiler: clang++-18
            cxx-std: 'c++23'
          - runs-on: ubuntu-24.04
            compiler: g++-14
            cxx-std: 'c++2b'
    runs-on: ${{ matrix.runs-on }}
    env:
      CXX: ${{ matrix.compiler }}
      CXXFLAGS: -std=${{ matrix.cxx-std }} -Wall -Wextra -Wold-style-cast -Wunused-parameter -Wpedantic -Werror -pthread -Wno-unknown-warning -Wno-unknown-warning-option
    steps:
    - uses: actions/checkout@v4
    - name: Install compiler
      if: startsWith(matrix.runs-on, 'ubuntu')
      run: sudo apt-get install -y $CXX
    - name: Compiler name & version
      run: $CXX --version
    - name: Build
      run: $CXX source/cppfront.cpp $CXXFLAGS -o cppfront
    - name: Upload binary (linux)
      if: startsWith(matrix.runs-on, 'ubuntu') && (matrix.compiler == 'clang++-14')
      uses: actions/upload-artifact@v3
      with:
        name: cppfront
        path: cppfront-linux
    - name: Upload binary (macos)
      if: startsWith(matrix.runs-on, 'macos') && (matrix.compiler == 'clang++-14')
      uses: actions/upload-artifact@v4
      with:
        name: cppfront
        path: cppfront-macos
        overwrite: true
        
  release:
    needs: [build-windows, build-unix-like]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git tag -l "v*" --sort=-creatordate | head -n 1)
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Download binaries (Windows)
        uses: actions/download-artifact@v4
        with:
          name: cppfront-windows
          path: ./binaries/windows
      - name: Download binaries (Linux)
        uses: actions/download-artifact@v4
        with:
          name: cppfront-linux
          path: ./binaries/linux
      - name: Download binaries (MacOS)
        uses: actions/download-artifact@v4
        with:
          name: cppfront-macos
          path: ./binaries/macos

      - name: Create Release
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          artifacts: "./binaries/windows/*,./binaries/linux/*,./binaries/macos/*"
          body: |
            Release for ${{ env.TAG }} (from ${{ github.sha }})
          replacesArtifacts: true
          allowUpdates: true
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: ${{ env.TAG }}
          body: |
            Release for ${{ env.TAG }} (from ${{ github.sha }})
          draft: false
          prerelease: false
          files: |
            ./binaries/windows/cppfront-windows.exe
            ./binaries/linux/cppfront-linux
            ./binaries/macos/cppfront-macos
